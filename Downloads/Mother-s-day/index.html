<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentinho</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Querida Mãe</strong>
                        <p>
                            Feliz dias das mães para a melhor mãe do mundo. <br>
                            Hoje e todos os dias você merece sempre o melhor, eu te amo
                        </p>
                        <p>Com todo o meu amor,<br>
                            Renan
                        </p>
                        <img class="img" src="photo.jpg" alt="">
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>
    <H1>EU TE AMO</H1>
    <div class="gallery">
        <img src="photo1.jpg" alt="">
        <img src="photo2.jpg" alt="">
        <img src="photo3.png" alt="">
        <img src="photo4.jpg" alt="">
        <img src="photo5.jpg" alt="">
        <img src="photo6.jpg" alt="">
        <img src="photo7.jpg" alt="">
        <img src="photo8.jpg" alt="">
        <img src="photo9.jpg" alt="">
    </div>

    <script>
        const envelope = document.querySelector('.envelope-wrapper');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
